[package]
name = "mockaco-gpui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WGPUI presentation and input adapter for Mockaco"

[features]
default = []
native-wgpui = ["dep:wgpui"]

[dependencies]
mockaco-core = { path = "../mockaco-core" }
mockaco-language = { path = "../mockaco-language" }
mockaco-diff = { path = "../mockaco-diff" }
mockaco-renderer = { path = "../mockaco-renderer" }
# The native view targets the same WGPUI (gpui-ce) tree Pulsar builds against;
# hosts that patch that git source (as Pulsar does) get one shared copy.
wgpui = { package = "gpui-ce", git = "https://github.com/Far-Beyond-Pulsar/WGPUI", optional = true }

[lib]
path = "src/lib.rs"
