[package]
name = "mockaco-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Framework-independent editing primitives for Mockaco"

[lib]
path = "src/lib.rs"


[dependencies]
# A B-tree rope: O(log n) edits and line lookups, O(1) snapshot clones.
# Only LF is a line break, matching Mockaco's line model (CR before LF is part
# of the line ending, a lone CR is ordinary text).
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# Regular-expression search (`SearchQuery::regex`).
regex = "1"
