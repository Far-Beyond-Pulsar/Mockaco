[package]
name = "mockaco-example"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
native-wgpui = ["dep:wgpui", "mockaco-gpui/native-wgpui"]

[dependencies]
mockaco-core = { path = "../mockaco-core" }
mockaco-diff = { path = "../mockaco-diff" }
mockaco-gpui = { path = "../mockaco-gpui" }
mockaco-lsp = { path = "../mockaco-lsp" }
mockaco-renderer = { path = "../mockaco-renderer" }
wgpui = { version = "0.3.6", optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "mockaco-example"
path = "src/main.rs"
