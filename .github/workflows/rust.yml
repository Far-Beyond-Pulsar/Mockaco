name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system libraries
      # The native WGPUI view links fontconfig and freetype (text), and X11,
      # xkbcommon and wayland (windowing); libz-sys wants zlib.
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev \
          libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxrandr-dev \
          libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
          libvulkan-dev zlib1g-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
